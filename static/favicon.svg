<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="circle">
      <circle cx="32" cy="32" r="30"/>
    </clipPath>

    <filter id="misaligned">
      <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#049EBC"/>
      <feDropShadow dx="-2" dy="0" stdDeviation="0" flood-color="#ED4A96"/>
      <feDropShadow dx="0" dy="-2" stdDeviation="0" flood-color="#FCEA33"/>
    </filter>
  </defs>

  <circle
    cx="32"
    cy="32"
    r="30"
    pathLength="360"
    fill="none"
    stroke="#000A1B"
    stroke-width="60"
    stroke-dasharray="12 12"
    transform="rotate(-90 32 32)"
    clip-path="url(#circle)"
    filter="url(#misaligned)"
  />
</svg>