{{ define "main" }}
  <h1>{{ .Site.Title }}</h1>
  {{ .Content }}
  {{ range site.RegularPages }}
    <section>
      <h2><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
      {{ with .Resources.Get .Params.Image }}
        {{ with .Resize "300x" }}
          <img src="{{ .RelPermalink }}" width="{{ .Width }}" height="{{ .Height }}" alt="">
        {{ end }}
      {{ end }}
      {{ .Summary }}
    </section>
  {{ end }}
{{ end }}
