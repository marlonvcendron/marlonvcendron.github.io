<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" dir="{{ or site.Language.Direction `ltr` }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <header>
    {{ partial "header.html" . }}
  </header>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="misaligned-effect">
    {{ partial "footer.html" . }}
  </footer>
  <canvas id="canvas"></canvas>
</body>
{{ partialCached "js.html" . }}
</html>
